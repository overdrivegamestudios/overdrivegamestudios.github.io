<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Contact — Overdrive Game Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  .contact-center {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8rem 1.5rem 3rem;
  }
  .contact-center p { color: var(--light); max-width: 500px; margin-bottom: 2.5rem; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="https://static.wixstatic.com/media/e54274_16ae863a0cc0450b8e6d7e84aead2220~mv2.png" alt="Overdrive logo placeholder" onerror="this.style.display='none'"/>
    <span>OVERDRIVE</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="games.html">Games</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<div class="contact-center">
  <div class="section-eyebrow" style="justify-content:center;">Get In Touch</div>
  <div class="section-title" style="margin-bottom:1.5rem;">Contact <em>Us</em></div>
  <p>[Dummy text] Have a question, a pitch, or just want to talk games? Drop us a line below.</p>

  <form style="width:100%;max-width:500px;display:flex;flex-direction:column;gap:1rem;">
    <input type="text" placeholder="Name" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:.9rem 1.1rem;font-family:'Outfit',sans-serif;"/>
    <input type="email" placeholder="Email" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:.9rem 1.1rem;font-family:'Outfit',sans-serif;"/>
    <textarea placeholder="Type your message here..." rows="6" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:.9rem 1.1rem;font-family:'Outfit',sans-serif;resize:vertical;"></textarea>
    <button type="submit" class="btn btn-primary" style="align-self:center;">Send Message</button>
  </form>
</div>

<footer>
  <span class="footer-logo">OVERDRIVE</span>
  <span class="meta">Overdrive Game Studios LLC · Illinois</span>
  <span class="meta">© 2026</span>
</footer>

</body>
</html>
